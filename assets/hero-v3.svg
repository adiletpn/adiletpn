    .disk { animation: spin 30s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shoot { opacity: 0; animation: shoot 14s cubic-bezier(.3,0,.7,1) infinite; }
    @keyframes shoot {
      0% { opacity: 0; transform: translate(0, 0); }
      2% { opacity: 0.9; }
      10% { opacity: 0; transform: translate(-260px, 116px); }
      100% { opacity: 0; transform: translate(-260px, 116px); }
    }
