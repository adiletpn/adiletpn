<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .name { font: 800 38px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F0F3F8; }
    .role { font: 500 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9AA4B2; }
    .chip { font: 600 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .t { font-size: 14px; fill: #C9D1D9; opacity: 0; animation: show 0.01s forwards; }
    .p { fill: #FF8A4C; }
    .ok { fill: #3FB950; }
    .dim { fill: #7D8590; }
    .acc { fill: #79C0FF; }
    .cursor { fill: #FF8A4C; opacity: 0; animation: show 0.01s 4.6s forwards, blink 1s 4.6s steps(1) infinite; }
    .glow { animation: drift 9s ease-in-out infinite alternate; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes drift { to { transform: translate(40px, 18px); } }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#7C6CFF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="880" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="url(#bg)"/>
    <circle class="glow" cx="120" cy="250" r="110" fill="#FF8A4C" opacity="0.22" filter="url(#blur)"/>
    <circle class="glow" cx="760" cy="40" r="120" fill="#7C6CFF" opacity="0.25" filter="url(#blur)"/>
    <rect width="880" height="3" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- left: who -->
  <text x="44" y="92" class="name">Adilet</text>
  <text x="44" y="134" class="name">Zholdasbek</text>
  <text x="44" y="170" class="role">Backend &amp; mobile developer</text>
  <text x="44" y="194" class="role">I ship automation that runs in production</text>

  <g transform="translate(44 222)">
    <rect width="196" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle class="live" cx="17" cy="15" r="4" fill="#3FB950"/>
    <text x="28" y="19.5" class="chip">2 848 contributions / year</text>
    <rect x="206" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="222" y="19.5" class="chip">📍 Taraz, Kazakhstan</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(430 34)">
    <rect width="410" height="232" rx="14" fill="#0D1117" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F57"/><circle cx="38" cy="18" r="5" fill="#FEBC2E"/><circle cx="56" cy="18" r="5" fill="#28C840"/>
    <text x="205" y="22" text-anchor="middle" class="dim" font-size="12">~/adilet — zsh</text>
    <line x1="0" y1="36" x2="410" y2="36" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <text x="18" y="62" class="t" style="animation-delay:0.3s"><tspan class="p">❯</tspan> whoami</text>
    <text x="18" y="84" class="t" style="animation-delay:0.9s">backend · mobile · automation</text>

    <text x="18" y="114" class="t" style="animation-delay:1.6s"><tspan class="p">❯</tspan> cat stack.txt</text>
    <text x="18" y="136" class="t" style="animation-delay:2.2s"><tspan class="acc">python</tspan> · <tspan class="acc">flutter</tspan> · <tspan class="acc">nestjs</tspan> · <tspan class="acc">c/c++</tspan></text>

    <text x="18" y="166" class="t" style="animation-delay:2.9s"><tspan class="p">❯</tspan> ./ship --to production</text>
    <text x="18" y="188" class="t" style="animation-delay:3.6s"><tspan class="ok">✔</tspan> bots, CRMs, call analytics</text>
    <text x="18" y="210" class="t" style="animation-delay:4.1s"><tspan class="ok">✔</tspan> things built from scratch, for fun</text>
    <rect x="18" y="222" width="9" height="3" class="cursor"/>
  </g>
</svg>
